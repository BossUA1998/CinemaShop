<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Activation</title>
</head>
<body style="font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5;">
    <div style="background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center;">
        <h2 style="margin-bottom: 1rem; color: #333;">Account Activation</h2>
        <p style="color: #666; margin-bottom: 1.5rem;">Click the button below to activate your account</p>

        <form method="POST" action="{{ action_url }}">
            <input type="hidden" name="email" value="{{ email }}">
            <input type="hidden" name="token" value="{{ token }}">
            <button type="submit" style="background: #4f46e5; color: white; border: none; padding: 0.75rem 2rem; border-radius: 6px; font-size: 1rem; cursor: pointer;">
                Activate Account
            </button>
        </form>
    </div>
</body>
</html>
